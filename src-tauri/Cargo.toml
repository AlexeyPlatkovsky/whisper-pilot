[package]
name = "whisper-pilot"
version = "1.9.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "whisperpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hound = "3"
# WhisperPilot currently targets macOS; opt out of rfd's default Linux portal
# stack, which is unused here and carries a vulnerable quick-xml transitively.
# On macOS rfd needs no explicit backend. The non-macOS CI target (Linux) must
# still build, so the target-specific section below adds the gtk3 backend there
# (the CI installs libgtk-3-dev).
rfd = { version = "0.15", default-features = false }
anyhow = "1"
thiserror = "2"
dirs-next = "2"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
sha2 = "0.10"
futures-util = "0.3"
sherpa-rs = { version = "0.6.8", features = ["download-binaries"] }
# The current ort 2.x line needs Rust 1.88; this pinned 1.16.3 tag declares
# Rust 1.70 and dynamically loads the ONNX Runtime dylib WP-60 already bundles.
ort = { git = "https://github.com/pykeio/ort.git", tag = "v1.16.3", default-features = false, features = ["load-dynamic"] }
ndarray = "0.15"
tar = "0.4"
bzip2 = "0.4"
# Only for `_exit` in the diarization worker's orphan watch (ADR-013): it must
# terminate without running the native runtime's static destructors underneath
# a thread still inside inference, and without SIGABRT's crash reports.
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"

# Metal GPU acceleration is macOS-only; CI runs on Linux so the feature must be
# conditional. Cargo target-specific dependency sections handle this correctly.
# cpal and screencapturekit are also macOS-only here: cpal's default Linux
# backend (alsa-sys) needs ALSA dev headers CI does not install, and
# ScreenCaptureKit is an Apple-only framework. Both are Streaming's (WP-70)
# audio capture: cpal for the microphone, screencapturekit for system-audio
# loopback. screencapturekit's mandatory `apple-metal` dependency needs a
# full Xcode.app (not just Command Line Tools) to link its Swift
# compatibility libraries — see streaming_audio.rs's module doc comment.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
llama-cpp-2 = { version = "0.1", default-features = false, features = ["metal", "dynamic-link"] }
screencapturekit = "8.0.1"
cpal = "0.17.3"
[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
whisper-rs = { version = "0.16" }
llama-cpp-2 = { version = "0.1", default-features = false }

# brotli 8.x (via tauri-codegen) requires alloc-no-stdlib ^2, but transitive deps
# allow >=2.0.4,<4 and Cargo otherwise picks 3.0.0, splitting the type identity.
# Pin both so alloc-no-stdlib stays unified at 2.0.4. (Same issue as voice-pilot.)
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true
