name: OpenCode Review

# Public repo: this workflow is restricted to the repository owner only.
# - On PR open/update: reviews the current diff.
# - On a PR comment containing /oc or /opencode: runs on demand.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Least privilege needed to read the code and post review comments.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Gate every entry point to the owner. On a public repo this stops anyone
    # else from triggering OpenCode (and burning the API key) via a comment.
    if: >
      (github.event_name == 'workflow_dispatch' && github.actor == 'AlexeyPlatkovsky') ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'AlexeyPlatkovsky'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'AlexeyPlatkovsky' &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install verified OpenCode CLI
        env:
          OPENCODE_VERSION: v1.18.31
          OPENCODE_SHA256: e9312be75ed803b7415fc2aeabda1f4fe938912a39673762dc0c38c0e11ebde4
        run: |
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          bin_dir="$RUNNER_TEMP/opencode-bin"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir"
          chmod 0755 "$bin_dir/opencode"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: OpenCode review
        # This prompt is used for pull_request/workflow_dispatch. On an
        # issue_comment, `opencode github run` reads the triggering comment.
        run: opencode github run
        env:
          MODEL: opencode-go/deepseek-v4-pro
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          MENTIONS: /opencode,/oc
          PROMPT: |
            Review this pull request against WhisperPilot's own conventions in
            AGENTS.md and docs/. You cannot run tests, lint, build, or the app
            itself in this environment — base every finding only on reading the
            diff and the repository files, never on assumed runtime behavior.

            WhisperPilot is a macOS transcription app with file, live system-audio,
            microphone, local-model, and optional BYOK paths: a Tauri v2 +
            React/TypeScript front-end in src/ and a Rust core in src-tauri/src/.

            Review only the files changed in this PR, across these dimensions:
            0. Ignore any changes under .claude, .ai, .manifesto or .github/workflows/opencode.yml.
            1. Code quality
               - Best practices for the language/framework actually used (React/TS
                 idioms in src/, idiomatic Rust/Tauri command patterns in
                 src-tauri/src/).
               - Duplication: logic repeated across components/modules that should
                 be extracted or shared instead.
               - Bloat: unnecessary abstraction, dead code, unused exports/props,
                 speculative generality the current change does not need.
               - KISS/DRY: flag over-engineered solutions where a simpler one
                 would do, and repeated constants/logic that should be factored
                 out.
               - Structure: a production source module at 750 lines or more is a
                 blocking split candidate; test modules at 1,750 lines or more
                 require an explicit navigation/split finding. Do not accept a
                 mechanical split that merely moves the same mixed responsibility.

            2. Test case quality (do not attempt to run any test)
               - Rust: unit tests colocated in src-tauri/src/, integration tests
                 in src-tauri/tests/.
               - Front-end: Vitest tests colocated as *.test.tsx / *.test.ts next
                 to the module under test.
               - Check new or changed logic has corresponding coverage, that
                 assertions are meaningful (not tautological, not over-mocked),
                 and that edge cases and error paths are exercised, not just the
                 happy path.
               - Per docs/testing.md: pure logic should be unit-tested by
                 construction; model-dependent behavior (real Whisper/diarization
                 output) belongs only in the ignored end-to-end pipeline test, not
                 faked inside unit tests.

            3. Documentation synchronization
               - If the change affects behavior, IPC commands, screens/flows, or
                 architecture, check whether the matching doc was updated in this
                 same PR: docs/architecture.md, docs/design.md, docs/testing.md,
                 docs/development.md, README.md, docs/INDEX.md, and the relevant
                 `.taskpilot/items/` lifecycle record when the work is tracked.
               - Flag docs that now contradict the code, or new behavior/commands
                 left undocumented. Do not flag pre-existing doc gaps unrelated to
                 this diff.

            Do not flag formatting/lint issues a formatter would already catch,
            and do not suggest running any command, build, or test — you have no
            way to execute anything in this environment. Keep every comment
            specific to a file and line in the diff.

            Only post problem findings — things that should be changed, fixed,
            or reworked. Do not mention or praise anything that is already
            done well; a clean file or a correct pattern gets no comment at
            all. If, after reviewing across all the dimensions above, there is
            nothing worth changing, fixing, or reworking, post a review body
            consisting of exactly: "No objections."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
