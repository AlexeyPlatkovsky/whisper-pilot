name: Build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same as ci.yml: sherpa-rs-sys downloads native libs into
      # dirs::cache_dir()/sherpa-rs, outside rust-cache's reach; cache it
      # separately and force a rebuild on miss so warm rust-cache hits link.
      - name: Cache sherpa-onnx native libraries
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sherpa-rs
          key: sherpa-rs-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: sherpa-rs-${{ runner.os }}-

      - name: Rebuild sherpa-rs-sys on sherpa cache miss
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys

      - run: npm ci

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml)
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperPilot-${{ steps.version.outputs.value }}-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
