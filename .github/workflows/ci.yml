name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gates:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - typecheck
          - lint
          - lint-comments
          - format-check
          - frontend-test-coverage
          - rust-fmt
          - rust-clippy
          - rust-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        if: matrix.check != 'rust-fmt' && matrix.check != 'rust-clippy' && matrix.check != 'rust-test'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        if: matrix.check != 'rust-fmt' && matrix.check != 'rust-clippy' && matrix.check != 'rust-test'
        run: npm ci

      - name: Install Linux system dependencies
        if: matrix.check == 'rust-clippy' || matrix.check == 'rust-test'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev

      - name: Install Rust toolchain
        if: matrix.check == 'rust-fmt' || matrix.check == 'rust-clippy' || matrix.check == 'rust-test'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        if: matrix.check == 'rust-clippy' || matrix.check == 'rust-test'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # sherpa-rs-sys downloads onnxruntime/sherpa-onnx libs into
      # dirs::cache_dir()/sherpa-rs (NOT target/), so rust-cache never
      # preserves them. On a warm rust-cache hit the build script does not
      # rerun, the download never happens, and linking fails with
      # "unable to find library -lonnxruntime". Cache that directory
      # separately; on a miss, force the build script to rerun so it
      # re-downloads (this also self-heals a poisoned warm target cache).
      - name: Cache sherpa-onnx native libraries
        if: matrix.check == 'rust-clippy' || matrix.check == 'rust-test'
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sherpa-rs
          key: sherpa-rs-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: sherpa-rs-${{ runner.os }}-

      - name: Rebuild sherpa-rs-sys on sherpa cache miss
        if: (matrix.check == 'rust-clippy' || matrix.check == 'rust-test') && steps.sherpa-cache.outputs.cache-hit != 'true'
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys

      - name: Install cargo-nextest
        if: matrix.check == 'rust-test'
        uses: taiki-e/install-action@nextest

      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.check }}" in
            typecheck)
              npm run typecheck
              ;;
            lint)
              npm run lint
              ;;
            lint-comments)
              npm run lint:comments
              ;;
            format-check)
              npm run format:check
              ;;
            frontend-test-coverage)
              npm run test:coverage
              ;;
            rust-fmt)
              cargo fmt --manifest-path src-tauri/Cargo.toml --check
              ;;
            rust-clippy)
              cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
              ;;
            rust-test)
              cargo nextest run --manifest-path src-tauri/Cargo.toml
              ;;
          esac

  report:
    name: Post PR comment
    runs-on: ubuntu-latest
    needs: quality-gates
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Report results
        uses: actions/github-script@v7
        with:
          script: |
            const checkNames = [
              'typecheck',
              'lint',
              'lint-comments',
              'format-check',
              'frontend-test-coverage',
              'rust-fmt',
              'rust-clippy',
              'rust-test',
            ];

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const checkJobs = data.jobs.filter((job) => checkNames.includes(job.name));
            const rows = checkJobs.map((job) => {
              const icon =
                job.conclusion === 'success'
                  ? '✅'
                  : job.conclusion === 'failure'
                    ? '❌'
                    : '⏭️';
              return `| ${job.name} | ${icon} ${job.conclusion || job.status} |`;
            });

            const allSuccess = checkJobs.every((job) => job.conclusion === 'success');
            const overall = allSuccess ? '✅ Passed' : '❌ Failed';
            const body = `## CI Quality Gates — ${overall}

            [View workflow run](${runUrl})

            | Check | Result |
            |-------|--------|
            ${rows.join('\n')}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
