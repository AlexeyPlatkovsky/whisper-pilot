- docs/design.md describes the Streaming transcript header's three slots, the MFU panel toggle with its default and per-screen persistence, the split paired-row view with column minimums, and the pending, translating, failed and mirrored row states.
- docs/glossary.md defines live translation, target language, and the paragraph translation unit.
- The Streaming feature folder under docs/features/ carries requirements, tasks and scenarios covering translation and the MFU toggle, each traceable to a scope item and a milestone.
