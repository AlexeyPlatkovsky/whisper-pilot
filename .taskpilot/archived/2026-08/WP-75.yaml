description: "Type: task\nTitle: Prettify for Streaming — inline diff cleanup of a Streaming transcript\n\nDescription:\nAdd a Prettify capability to Streaming: a button that runs a finished\nsession's transcript through a dedicated cleanup prompt on the same local\nllama.cpp + Qwen2.5-Instruct model Craft/MFU already uses (WP-77), removing\nfiller words/interjections/duplication and polishing grammar, then shows the\nresult as an inline diff (deletions red+struck-through, additions bold\ngreen, unchanged unstyled) with Accept/Cancel icon-only controls, matching\nthe already-approved design (pencil/main_view.pen, \"Streaming Window\" frame,\nTranscript Header, illustrated example segment, \"Status Widget — States\"\npanel).\n\nUnlike Craft (which persists its result immediately on generation), Prettify\nis a review step: the LLM's cleaned text is returned but NOT persisted until\nthe user clicks Accept. Clicking Cancel discards it — no backend call, pure\nfrontend state discard.\n\nBackend: a new `llm::build_prettify_prompt`/`llm::prettify_transcript`\n(mirrors `build_prompt`/`generate_notes`'s structure but returns plain\ncleaned text, not a structured JSON template — this is a rewrite task, not a\nfield-extraction task). A new `streaming_prettified` table\n(`session_id INTEGER PRIMARY KEY REFERENCES streaming_sessions(id) ON DELETE\nCASCADE, text TEXT NOT NULL`) in `streaming_store.rs`, with `upsert_prettified`/\n`get_prettified`/`delete_prettified` mirroring `streaming_notes`'s exact\npattern. `StreamingSessionDto` gains `prettified_text: Option<String>`,\npopulated by `open_streaming_session` the same way `notes` already is.\nTwo new Tauri commands: `generate_streaming_prettify(id) -> String` (reuses\n`streaming::build_streaming_transcript`'s three guards — session exists,\nstopped, non-empty transcript — exactly like Craft; resolves the model via\nthe existing shared `resolve_llm_model_path` helper; returns the cleaned\ntext WITHOUT persisting it) and `accept_streaming_prettify(id, text) ->\nStreamingSessionDto` (persists the given text to `streaming_prettified`,\nreturns the refreshed DTO). No command is needed for Cancel.\n\nFrontend: a new `src/diff.ts` module with a word-level diff function\n(`computeWordDiff(original: string, updated: string): DiffSpan[]`, where\n`DiffSpan = { type: \"same\" | \"del\" | \"add\"; text: string }`), implemented\nas a standard LCS-based word/whitespace-token diff — no new npm dependency\n(the project has none beyond `@tauri-apps/api`/`react`/`react-dom`; adding\none for this would be a real dependency-footprint change outside this\ntask's scope). The LLM returns plain cleaned text; the diff is always\ncomputed client-side against the original transcript, never LLM-generated\nmarkup, since LLM-produced structural markup is unreliable.\n\n`StreamingView.tsx` gains a Prettify button (wand-sparkles icon) in the\nexisting `.streaming-transcript-actions` row (alongside Copy/Export/Craft —\nthe approved design's separate \"Transcript Header\" placement was never\nadopted into the real shipped header even for WP-76/WP-77's Craft button,\nso this follows the same established real-component convention), enabled\nonly when: not running, has real decoded text, no Prettify request already\nin flight for this session, no Craft request already in flight for this\nsession, AND no review is already pending (`pendingPrettify === null`) —\nclicking Prettify again while a diff is already showing is disabled rather\nthan starting a second concurrent request or silently discarding the first.\nWhile a review is pending, the transcript panel renders the diff view\ninstead of plain window text, and\ntwo new icon-only buttons (check = Accept, x = Cancel) appear in the same\nactions row. Accepting persists the text and clears the pending review, and\nsubsequently both the transcript panel and Copy/Export use\n`prettified_text` instead of the raw per-window text (this is the whole\npoint of prettifying — cleaner display and exported output). Canceling\nclears the pending review with no backend call, reverting to\
  \ the\nprior view (raw windows, or the already-accepted `prettified_text` from an\nearlier Accept, if one exists).\n\nThe header status widget gains two more states (already designed,\npencil/main_view.pen \"Status Widget — States\"): \"Prettifying…\" (accent\nspinner, elapsed timer, same tone/pattern as \"Crafting MFU…\") while the\nrequest is in flight, and \"Prettify Failed\" (red alert-circle, no timer) on\nfailure — shown in the widget until the next Prettify attempt or new\nsession Start (mirrors \"MFU Failed\"'s exact persistence rule from WP-77,\nincluding the Delete-clears-it fix from that task's own review cycle).\n\"Prettifying…\"/\"Crafting MFU…\" are mutually exclusive in the same way\nCraft/Start already are — the Prettify button is disabled while Craft is in\nflight for the session and vice versa, since both are LLM calls against the\nsame shared model-loading path and Meeting's own Craft is already\nUI-blocking for this reason.\n\nNon-goals:\n- Editing the diff by hand before accepting (Accept/Cancel are the only two\n  actions — no partial-accept, no manual text editing).\n- Persisting or displaying the pending (not-yet-accepted) diff across a\n  session switch or app restart — canceling, switching sessions, or\n  closing the app all discard an in-progress review with no warning beyond\n  what Cancel already implies.\n- Using a previously-accepted `prettified_text` as either the LLM's input\n  or the diff's \"original\" side on a later Prettify run. Every run —\n  including a second one after an earlier Accept — sends the same raw\n  transcript (via `build_streaming_transcript`) to the LLM and diffs the\n  new result against that same raw transcript, never against a prior\n  accepted result. Accepting again simply overwrites the previously\n  accepted `prettified_text` row.\n- Any change to Craft/MFU's own behavior, or to Meeting's Prettify (Meeting\n  has no Prettify feature — this is Streaming-only, per WP-68's own\n  non-goals excluding Prettify from Meeting entirely).\n- A network-fetched diff library — implemented as a small self-contained\n  module instead (see Backend/Frontend above).\n\nAcceptance criteria (DoD):\n- [ ] With a stopped session that has real decoded text, clicking Prettify\n      calls the new IPC command, shows \"Prettifying…\" (accent spinner +\n      timer) in the status widget, and on success renders an inline diff\n      (deletions red+struck-through, additions bold green, unchanged\n      unstyled) with Accept/Cancel icon buttons visible.\n- [ ] The Prettify button is disabled while the session is running, has no\n      real decoded text, a Prettify request is already in flight for this\n      session, a Craft request is already in flight for this session (and\n      vice versa — Craft is disabled while Prettify is in flight), or a\n      Prettify review is already pending for this session.\n- [ ] Clicking Accept persists the prettified text via the new accept\n      command, clears the pending review, and both the transcript panel and\n      Copy/Export subsequently use the accepted text instead of raw windows.\n- [ ] Clicking Cancel clears the pending review with no backend call,\n      leaving the prior display (raw windows, or a previously-accepted\n      prettified text) and the original transcript/notes untouched.\n- [ ] On failure (no LLM model, or any other error), the existing error\n      banner shows the message AND the widget shows \"Prettify Failed\" until\n      the next Prettify attempt or new session Start.\n- [ ] Deleting the active session while \"Prettify Failed\" is showing clears\n      it (matching WP-77's Craft-equivalent fix).\n- [ ] Deleting the active session while a Prettify review is pending (diff\n      shown, not yet Accepted/Canceled) clears the pending review too, the\n      same state-lifecycle-completeness reason as the \"Prettify Failed\" bullet\n      above.\n- [ ] An empty effective transcript, a nonexistent session ID, or an active\n      (not stopped) session are all rejected server-side by\n      `generate_streaming_prettify`, even bypassing\
  \ the UI guard (reuses\n      `build_streaming_transcript`'s existing three guards — no new guard\n      logic to duplicate/test beyond confirming reuse).\n- [ ] `computeWordDiff` correctly diffs: identical text (all \"same\" spans,\n      no del/add), pure deletion, pure addition, pure replacement (mixed\n      del+add), and empty-string inputs on either side.\n- [ ] Switching sessions while a Prettify request is in flight for a prior\n      session does not attribute that result or error to the newly active\n      session (mirrors WP-77's Craft cross-session isolation exactly).\n- [ ] `accept_streaming_prettify` persists correctly on a second run\n      (upsert, not duplicate row), and deleting a session cascades its\n      `streaming_prettified` row.\n\nConstraints / design notes:\nBackend: same local-only llama.cpp inference path, no new network calls.\n`computeWordDiff` runs synchronously on the main thread — acceptable given\nStreaming transcripts are bounded by session length (minutes to low hours of\nspeech, not documents), and Prettify itself is already an LLM-latency-bound\noperation the user is actively waiting on. Security: none new. Interaction\ncontract: Prettify follows the same enabled/disabled/icon-only convention as\nCraft/Copy/Export; Accept/Cancel are icon-only with no visible text label\n(per the approved design), each with an `aria-label`.\n\nDependencies / integration:\nParent epic WP-68 (done). Reuses WP-77's `resolve_llm_model_path` and\n`streaming::build_streaming_transcript` as-is (no changes to either).\nReuses WP-76's status widget architecture (`.wp-status`/`.wp-tone--*`),\nadding two more states the same way WP-77 did. Must not change Craft/MFU's\nown behavior, Meeting's behavior, or the existing On Air/Ready/Starting…\nstates.\n\nTarget surfaces:\nsrc-tauri/src/llm.rs (build_prettify_prompt, prettify_transcript),\nsrc-tauri/src/streaming_store.rs (streaming_prettified table, upsert/get/\ndelete_prettified), src-tauri/src/streaming.rs (StreamingSessionDto.\nprettified_text field), src-tauri/src/lib.rs (generate_streaming_prettify,\naccept_streaming_prettify commands + invoke_handler registration),\nsrc/diff.ts (new — computeWordDiff), src/ipc.ts (generateStreamingPrettify,\nacceptStreamingPrettify, prettified_text field), src/StreamingView.tsx\n(Prettify button, diff view rendering, Accept/Cancel buttons, prettifyingId/\npendingPrettify/prettifyFailed state, widget status extension), src/Icon.tsx\n(new wand-sparkles icon — the existing set has \"sparkles\" but not the\ndistinct wand variant the design specifies).\n\nProposed BDD scenarios:\n  Scenario S-1: Happy path — Prettify, review, Accept\n    Given a stopped session with real decoded text\n    When the user clicks Prettify, the backend returns cleaned text, and the\n      user clicks Accept\n    Then the widget cycles Ready → Prettifying… → Ready, a diff view was\n      shown during review, and after Accept the transcript panel and Copy/\n      Export use the accepted text\n\n  Scenario S-2: Cancel discards with no persistence\n    Given a pending Prettify review is showing\n    When the user clicks Cancel\n    Then no backend call is made, the review clears, and the transcript\n      panel reverts to its prior display\n\n  Scenario S-3: Prettify disabled with no real decoded text\n    Given a stopped session with only fail-open windows (or none)\n    When the transcript-actions row renders\n    Then the Prettify button is disabled\n\n  Scenario S-4: Prettify disabled while running\n    Given a session is On Air\n    When the transcript-actions row renders\n    Then the Prettify button is disabled\n\n  Scenario S-5: Craft and Prettify are mutually exclusive in flight\n    Given a Craft request is in flight for the open session\n    When the transcript-actions row renders\n    Then the Prettify button is disabled (and vice versa: Craft is disabled\n      while a Prettify request is in flight)\n\n  Scenario S-6: Failure surfaces in the error banner and the widget\n    Given the Prettify call rejects (e.g. no LLM model configured)\n    When\
  \ the user clicks Prettify\n    Then the error banner shows the message and the widget shows \"Prettify\n      Failed\"\n\n  Scenario S-7: Prettify Failed persists until the next relevant action\n    Given the widget shows \"Prettify Failed\"\n    When time passes with no further action\n    Then it keeps showing \"Prettify Failed\" (no auto-revert), until the next\n      Prettify attempt or a new session Start\n\n  Scenario S-8: Deleting the active session clears Prettify Failed\n    Given the widget shows \"Prettify Failed\" for the open session\n    When the user deletes that session\n    Then the widget no longer shows \"Prettify Failed\"\n\n  Scenario S-9: Same-session double-trigger prevented\n    Given a Prettify request is already in flight for the open session\n    When the user clicks Prettify again\n    Then the button is disabled and no second IPC call is made\n\n  Scenario S-10: Switching sessions during an in-flight Prettify\n    Given a Prettify request is in flight for session A\n    When the user opens session B before it resolves\n    Then A's eventual result or error is not applied to B's displayed state\n\n  Scenario S-11: Server-side guards reject bypassed-UI calls\n    Given a nonexistent session ID, or an active (not stopped) session, or\n      one with no real decoded text\n    When generate_streaming_prettify is called directly\n    Then it returns an error in each case (reusing build_streaming_\n      transcript's existing, already-tested guards)\n\n  Scenario S-12: Accept persists and re-accept upserts, not duplicates\n    Given a session already has an accepted prettified_text\n    When the user runs Prettify again and accepts the new result\n    Then the streaming_prettified row is updated in place, not duplicated\n\n  Scenario S-13: Deleting a session cascades its prettified text\n    Given a session has an accepted prettified_text\n    When the session is deleted\n    Then its streaming_prettified row is also gone\n\n  Scenario S-14: computeWordDiff — identical text\n    Given original and updated are byte-identical\n    When computeWordDiff runs\n    Then every span is type \"same\", none are \"del\"/\"add\"\n\n  Scenario S-15: computeWordDiff — pure deletion\n    Given updated is original with a trailing clause removed\n    When computeWordDiff runs\n    Then the removed words appear as \"del\" spans and nothing appears as \"add\"\n\n  Scenario S-16: computeWordDiff — pure addition\n    Given updated is original with a clause inserted\n    When computeWordDiff runs\n    Then the inserted words appear as \"add\" spans and nothing appears as\n      \"del\"\n\n  Scenario S-17: computeWordDiff — replacement (mixed del+add)\n    Given updated replaces one phrase in original with a different phrase\n    When computeWordDiff runs\n    Then the old phrase appears as \"del\" and the new phrase as \"add\", with\n      unchanged surrounding text as \"same\"\n\n  Scenario S-18: computeWordDiff — empty-string inputs\n    Given original is empty and updated is non-empty (and the reverse case)\n    When computeWordDiff runs\n    Then the non-empty side's words all appear as \"add\" (or \"del\" for the\n      reverse case), with no \"same\" spans\n\n  Scenario S-19: Prettify disabled while a review is already pending\n    Given a Prettify review (diff + Accept/Cancel) is already showing\n    When the transcript-actions row renders\n    Then the Prettify button is disabled\n\n  Scenario S-20: Deleting the active session clears a pending review\n    Given a Prettify review is pending for the open session\n    When the user deletes that session\n    Then the pending review is cleared (no diff, no Accept/Cancel shown)\n\nCase-derivation evidence:\n| Technique | Scenario IDs or justified N/A |\n|---|---|\n| Equivalence Partitioning | Prettify-enabled guards: running/stopped (S-4), text/no-text (S-3), Craft-in-flight/not (S-5), Prettify-in-flight/not (S-9), review-pending/not (S-19); computeWordDiff: identical/pure-del/pure-add/mixed/empty (S-14–S-18) |\n| Boundary Value Analysis | S-18 (empty-string boundary\
  \ on either side of computeWordDiff) |\n| Decision Table | Prettify button: (isRunning, hasCraftableText, prettifyingId===activeId, craftingId===activeId, pendingPrettify!==null) -> enabled only at (false, true, false, false, false); covered by S-1/S-3/S-4/S-5/S-9/S-19 |\n| State-Transition | S-1 (Ready→Prettifying…→Ready), S-2 (review→cleared, no state-widget change), S-6/S-7 (Ready→Prettifying…→Prettify Failed, persists), S-8 (Prettify Failed→cleared via Delete), S-20 (pending review→cleared via Delete) |\n| Pairwise / Combinatorial | N/A — justified: five independent boolean guards on the Prettify button, fully enumerated by the Decision Table above (mirrors WP-77's identical justification for Craft's three-guard case, extended by two more independent guards) |\n\nChild-task breakdown:\nNot applicable — task altitude.\n\nChild-feature breakdown:\nNot applicable — task altitude.\n\nApproved draft: streaming-followups:wp-75:3, digest sha256:2d1cce784fb23bb7c287e842918edb90044c20d275aee4618df13686cfb44802, scope-verifier: No gaps."
dod:
- With a stopped session that has real decoded text, clicking Prettify calls the IPC command, shows "Prettifying…" (accent spinner + timer) in the status widget, and on success renders an inline diff (deletions red+struck-through, additions bold green, unchanged unstyled) with Accept/Cancel icon buttons visible.
- The Prettify button is disabled while the session is running, has no real decoded text, a Prettify request is already in flight for this session, a Craft request is already in flight for this session (and vice versa), or a Prettify review is already pending for this session.
- Clicking Accept persists the prettified text via the accept command, clears the pending review, and both the transcript panel and Copy/Export subsequently use the accepted text instead of raw windows.
- Clicking Cancel clears the pending review with no backend call, leaving the prior display and the original transcript/notes untouched.
- On failure, the existing error banner shows the message AND the widget shows "Prettify Failed" until the next Prettify attempt or new session Start.
- Deleting the active session while "Prettify Failed" is showing clears it.
- Deleting the active session while a Prettify review is pending clears the pending review too.
- An empty effective transcript, a nonexistent session ID, or an active session are all rejected server-side by generate_streaming_prettify, even bypassing the UI guard.
- 'computeWordDiff correctly diffs: identical text, pure deletion, pure addition, pure replacement (mixed del+add), and empty-string inputs on either side.'
- Switching sessions while a Prettify request is in flight for a prior session does not attribute that result or error to the newly active session.
- accept_streaming_prettify persists correctly on a second run (upsert, not duplicate row), and deleting a session cascades its streaming_prettified row.
