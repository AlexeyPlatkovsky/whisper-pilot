description: 'Let the user rename a speaker (click-to-edit the ''Speaker N'' label WP-9 renders); apply the new label to every segment attributed to that speaker_id, and include the resolved label in the saved transcript text. Implements F002-R4 (F002-T6), parent WP-4. Depends on WP-9 (done) for the base speaker_id-driven label rendering this task adds renaming on top of.


  Scope: (1) src/App.tsx gains a speakerLabels: Record<number, string> state map (speaker_id -> custom label), a resolveSpeakerLabel(speakerId) helper (returns the custom label if renamed, else WP-9''s default speakerLabel(speakerId) from speakerColors.ts), and a renameSpeaker(speakerId, newLabel) setter. (2) new src/SpeakerLabelEditor.tsx component: renders the current label as a real, keyboard-operable <button> (click or Enter/Space to start editing, matching this app''s existing focusable-control precedent - no non-interactive div/span with a click handler); clicking swaps it for a real <input> (autofocused, aria-label ''Rename {label}'', matching this app''s existing aria-label-only-input precedent e.g. the sidebar search field) pre-filled with the current label; Enter or blur commits a non-empty trimmed value via the onRename callback (an empty/whitespace-only commit is a no-op, keeping the previous label - never renamed to blank); Escape cancels and reverts to the pre-edit label without calling onRename. (3) the segment-rendering map in App.tsx replaces WP-9''s plain <span className="wp-speaker-name"> with <SpeakerLabelEditor>, passing resolveSpeakerLabel(seg.speaker_id) as the current label. (4) transcriptText (used by both Save-to-file and any future copy action) is updated: a segment with a speaker_id is now written as ''<Label>: <text>'' per line instead of bare text; a segment without speaker_id (no diarization data) is written as bare text, unchanged from today.


  Happy path: the user clicks a ''Speaker 1'' label, types ''Alice'', presses Enter; every segment previously labelled ''Speaker 1'' now shows ''Alice'', and saving the transcript writes ''Alice: <segment text>'' for each of that speaker''s lines.


  Failure / edge cases: renaming one speaker does not affect any other speaker''s label; clearing the input to empty/whitespace and committing (Enter/blur) leaves the previous label unchanged (no blank rename); pressing Escape mid-edit reverts to the pre-edit label and does not call onRename; a segment with no speaker_id is completely unaffected by any rename (still bare text, no label editor rendered at all, matching WP-9''s existing no-speaker-data behavior).


  Scope boundary: does not persist the rename across app restarts or between different files/transcriptions (no meeting/library persistence exists yet - F004/WP-11; the rename lives only in this session''s React state, exactly as segment text edits already do today); does not implement speaker reassignment/merging (out of scope for M2 per roadmap.md); does not change WP-9''s color/default-label logic, only adds a rename layer on top; does not touch clipboard-copy (no copy action exists yet in this app''s UI - the header''s copy affordance is Settings/F004 scope, not built here).


  Target surfaces: new src/SpeakerLabelEditor.tsx (+tests), src/App.tsx (+speakerLabels state, +resolveSpeakerLabel, +renameSpeaker, wire SpeakerLabelEditor into the segment map, update transcriptText to include resolved labels).


  Constraints: renaming must not lose or corrupt any existing segment text/timestamp edits; the editor is fully keyboard-operable (Tab to reach it, Enter/Space to open, Enter to commit, Escape to cancel) per this project''s accessibility convention; no new IPC calls; empty renames are rejected client-side, not sent anywhere to fail.


  Scenarios (BDD):


  Given a segment labelled ''Speaker 1'' When the user clicks its label, types ''Alice'', and presses Enter Then every segment with that same speaker_id now shows ''Alice'', and other speakers'' labels are unchanged.


  Given the transcript is renamed and then saved When the saved text is inspected Then each renamed speaker''s segments are prefixed with the new label (''Alice: ...'') and segments without a speaker_id remain bare text.


  Given the user opens the editor and clears the input to empty text, then presses Enter or blurs When the commit is evaluated Then the label reverts to its previous value, never becoming blank.


  Given the user opens the editor, types a new value, then presses Escape When the edit is cancelled Then the label reverts to its pre-edit value and no rename is applied.'
dod:
- Renaming a speaker updates every segment sharing that speaker_id and leaves other speakers' labels unchanged - verified by a frontend test.
- 'The saved transcript text includes each segment''s resolved label (''Label: text'') when speaker_id is present, and bare text when absent - verified by a frontend test.'
- Committing an empty/whitespace-only rename leaves the previous label unchanged (no blank label) - verified by a frontend test.
- Escape cancels an in-progress edit without applying a rename - verified by a frontend test.
- The editor is keyboard-operable (a real button and input, not a div/span with a click handler) with an accessible name, matching this project's accessibility convention.
- Full frontend test suite, tsc, lint, and format all pass with no regressions.
