description: "Add a fixed, app-defined AI model catalog and render it as the real content of the Settings \"AI models\" section (replacing WP-38's placeholder), with per-task Download (fetch + SHA-256 verify + progress). Implements F005-R3 (F005-T3), parent WP-35. Depends on WP-37 (settings store, not used directly by this task) and WP-38 (Settings shell, done).\nCatalog (beta, verified against the real sources, not fabricated): - task \"transcription\": 1 asset - ggml-large-v3-turbo-q8_0.bin from\n  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin,\n  sha256 317eb69c11673c9de1e1f0d459b253999804ec71ac4c23c17ecf5fbe24e259a1,\n  size 874188075 bytes. This is the same model src-tauri/src/transcribe.rs\n  already expects by default (ggml-large-v3-turbo-q8_0.bin) - confirmed via\n  a live HTTPS HEAD request against Hugging Face's CDN\n  (x-linked-etag/x-linked-size headers), not guessed.\n- task \"diarization\": a 2-asset bundle presented as ONE catalog entry/row\n  (satisfies \"one model per task\" at the UX level; diarization genuinely\n  needs both files to function later) -\n  (a) sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 from\n  https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2,\n  sha256 24615ee884c897d9d2ba09bb4d30da6bb1b15e685065962db5b02e76e4996488\n  (computed directly from the downloaded bytes), size 6958444 bytes;\n  (b) 3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx from\n  https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx,\n  sha256 357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b\n  (from the release's own published checksum.txt), size 29596978 bytes.\n- \"notes\" task is M3/out of scope (F005-R3 explicitly defers it).\nHappy path: the AI models section lists each task with its model state (not downloaded / downloading with a progress bar / ready); clicking Download streams the file(s) to the app support directory, verifies each against its known SHA-256, and only then marks the task's model ready; diarization's two assets download sequentially under one Download click and one progress bar, ready only when both verify.\nFailure / edge cases: a network failure or SHA mismatch leaves the task in a visible error state (not silently \"not downloaded\" and not falsely \"ready\") and does not leave a partially-written file at the final path (a half-written file must never be mistaken for a ready model - write to a temp path and rename only after verification passes); re-download after a failure works cleanly; SHA mismatch is reported to the user, not silently accepted; the whole app must not block while a download runs (progress events, cancellable is out of scope for this task - no Stop control yet).\nScope boundary: this task does not implement Delete (WP-40), does not wire missing-model state into Transcribe/diarization availability (WP-40), does not extract/parse the downloaded diarization archive's internal format (that is diarize.rs's concern whenever its own epic, WP-1, is built - this task only fetches, verifies, and stores the exact bytes named by the catalog URL), and does not implement the M3 Active-model radio (F005-R5).\nTarget surfaces: src-tauri/Cargo.toml (+reqwest with stream feature, +sha2), src-tauri/src/models.rs (new - catalog constants, ModelAsset/ TaskModel types, a Downloader trait for testability + a reqwest-backed impl, list_task_models(), download_model(id)), src-tauri/src/error.rs (download/verification error variants), src-tauri/src/lib.rs (list_task_models()/download_model(id) IPC commands + a model_download_progress { id, fraction } event per docs/architecture.md's IPC Contract), src/ipc.ts (typed wrapper + event listener), src/SettingsScreen.tsx (real AI models section content: per-task rows, Download button, progress bar, ready/error state - Appearance/App language stay placeholders, WP-41/42).\nConstraints: this is the product's first network egress (ADR-011) - HTTPS\
  \ only, to the two fixed URLs above, no other host; no app-sandbox entitlement exists yet so no additional macOS config is needed for this dev build; downloaded files land under the app support directory (alongside the WP-37 settings store) in a \"models\" subdirectory; SHA-256 verification is mandatory before a model is ever marked ready - this is a correctness/security boundary, not optional.\nScenarios (BDD):\nGiven the transcription model is not downloaded When the user clicks Download Then progress is shown and the model is marked ready only after SHA-256 verification succeeds (F005-S3).\nGiven a download is interrupted partway through When the user checks the AI models section afterward Then the task still shows not-downloaded (or a clear error), never a falsely \"ready\" state, and no half-written file exists at the final model path.\nGiven a completed download's bytes somehow do not match the catalog's known SHA-256 When verification runs Then the mismatch is reported to the user and the model is not marked ready.\nGiven the diarization task's two-asset bundle When the user clicks Download once Then both assets download and verify before the task is marked ready; if either fails, the task is not marked ready."
dod:
- list_task_models() returns the transcription and diarization catalog entries with an accurate downloaded/not-downloaded state read from disk (F005-R3).
- download_model streams the file(s) to the app support directory, verifies each against its known SHA-256 in the catalog, and only then marks that task's model ready; a SHA mismatch or network failure leaves no half-written file at the final path and does not mark the model ready.
- Progress is observable during download (model_download_progress event with a fraction), verified either via a Rust unit test on the emission logic or a frontend test on the progress bar reflecting event payloads.
- The AI models section in Settings shows each task's real state (not-downloaded / downloading / ready / error) and a working Download button, replacing WP-38's placeholder for this section only.
- Rust unit tests (via a mocked Downloader trait, no real network calls in tests) cover successful download plus verify, SHA mismatch handling (temp file discarded, not renamed to final path), and the not-downloaded-by-default list state. Frontend tests cover the AI models section's not-downloaded / downloading / ready render states.
