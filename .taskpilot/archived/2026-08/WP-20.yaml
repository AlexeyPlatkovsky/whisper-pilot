description: "Whisper is currently forced to Russian on every transcription: meetings.rs stamps language: \"ru\" on each new meeting, lib.rs transcribe_meeting reads it back, and transcribe.rs passes it to params.set_language. Forcing a language whisper the audio is not in makes the decoder collapse to its highest-prior training artifact. On a 5-minute English standup recording (2026-07-23 17-16-24.mp4) this produced 11 identical segments of \"Субтитры сделал DimaTorzok\" - one per whisper 30s analysis window - instead of the transcript. Reproduced byte-for-byte outside the app with a standalone probe against the same model and the same FullParams; changing only the language to auto yields DETECTED LANG: en and a correct, naturally segmented English transcript. Audio ingest (ffmpeg -vn -ac 1 -ar 16000 gives mean -23.8 dB / max -2.1 dB of real speech) and every decode threshold (temperature_inc, entropy, logprob, no_speech - all at upstream defaults; no_context already defaults to true) were ruled out with evidence.\n\n  Product decision (user, this run): the user must NOT be able to choose the transcription language at all - auto-detect is the only mode. This supersedes ADR-007, which made Russian the default with an opt-in per-transcription auto-detect toggle and explicitly rejected \"auto-detect as the only mode\" as an alternative. This task therefore replaces the originally planned language-selection UI rather than building it.\n\n  Scope: Rust only (src-tauri). Transcription always runs whisper with language auto-detection; no code path forces a fixed language. The language whisper actually decoded with is read from decoder state (full_lang_id_from_state + get_lang_str) and persisted on the meeting row, so meetings.language becomes an OUTPUT (what was detected) rather than an INPUT (what to force).\n\n  Happy path: a meeting with an attached English source file is transcribed; whisper detects \"en\"; the transcript is the real English speech in natural sub-30s segments; the meeting row ends up with language = \"en\".\n\n  Failure / edge cases: a meeting created but not yet transcribed carries an explicit not-yet-detected value instead of a hardcoded \"ru\" (the column is NOT NULL). A meeting row still holding a legacy bug-stamped \"ru\" needs no data migration, because language is no longer read as a decode input - the next run auto-detects and overwrites it. Whisper detects from the FIRST 30 SECONDS only, so a file that opens with silence or music can misdetect; accepted, not fixed here.\n\n  Scope boundary: no selector UI, no new IPC surface, no new settings key, no schema change and no data migration. Does not touch diarization, progress events, or Stop. The front-end needs no change: language is present on MeetingDto in src/ipc.ts but is never rendered.\n\n  Target surfaces: src-tauri/src/transcribe.rs (auto-detect params, return the detected language alongside the segments), src-tauri/src/lib.rs (transcribe_meeting stops passing meeting.language in, persists the detected code out; stale \"into Russian (default)\" doc comment), src-tauri/src/meetings.rs (creation default, persist detected language), src-tauri/src/store.rs (only if a write path is needed for the detected value), docs/architecture.md Transcription section, docs/decisions/ADR-007 supersession, docs/features/F004 requirements/scenarios/tasks (F004-R6, F004-S6, F004-T5), docs/design.md language selector entry, docs/idea.md, docs/roadmap.md, docs/glossary.md, README.md, docs/INDEX.md decision log.\n\n  Constraints: macOS only; no network calls; whisper detects language from the first 30 seconds of audio only; the detected-language write must not break the existing meetings CRUD contract or its tests; no panics on an unknown/unmapped language id (get_lang_str returns Option).\n\n  Scenarios (BDD):\n\n  Given a meeting whose source file is English speech When it is transcribed Then whisper is configured for auto-detection, the resulting segments are the real English speech, and no segment spans a full 30000ms window.\n\n  Given a transcription that whisper\
  \ decoded as \"en\" When it completes Then the meeting row persists language = \"en\".\n\n  Given a meeting created but never transcribed When it is stored Then its language is the explicit not-yet-detected value, not \"ru\".\n\n  Given an existing meeting row still holding the legacy bug-stamped language \"ru\" When it is re-transcribed Then the stored value is ignored as an input, the audio is auto-detected, and the row is overwritten with the detected code."
dod:
- No code path forces a fixed transcription language; whisper always runs with auto-detection, verified by a Rust unit test asserting the decode parameters rather than the transcript.
- The transcription path returns the language whisper actually decoded with, read from decoder state, and does not panic on an unknown/unmapped language id.
- A completed transcription persists the detected language code on the meeting row, verified by a Rust test against a temporary database.
- A meeting created but never transcribed persists an explicit not-yet-detected language value, not "ru", verified by a Rust test.
- A meeting row still holding the legacy value "ru" is not treated as a decode input; re-transcribing auto-detects and overwrites it. No schema change and no data migration are introduced.
- docs/architecture.md, docs/design.md, docs/idea.md, docs/roadmap.md, docs/glossary.md, README.md, and the F004 requirements/scenarios/tasks no longer state that the user chooses the transcription language; ADR-007's language-selection decision is recorded as superseded and docs/INDEX.md reflects it.
- cargo test (Rust) and npm run test:run (front-end) both pass with no regression, and clippy/lint/tsc/build are clean.
