description: "Type: task\nTitle: MFU/Craft for Streaming — generate structured notes from a Streaming transcript\n\nDescription:\nAdd a Craft/MFU capability to Streaming, mirroring Meeting's existing\n\"Create MFU\" feature (structured notes: summary, decisions, action items,\nopen questions, participants) generated by the same local llama.cpp +\nQwen2.5-Instruct model via `llm::generate_notes`, but for a Streaming\nsession's transcript instead of a Meeting's. This was discovered as a design\ngap during an earlier session (the Craft/sparkles icon already existed in\nthe Streaming header mockup, copied from Meeting's header, with no backing\nimplementation) and is an explicit follow-on to WP-68's core deliverable,\nnot required for it.\n\nBackend: `llm.rs` is refactored so its core generation logic returns a\ndomain-agnostic `GeneratedNotes` (summary/decisions/action_items/\nopen_questions/participants, no id field) instead of `MeetingNotes`\ndirectly — `parse_notes_json`/`generate_notes` return `Result<GeneratedNotes>`.\nThe existing Meeting `generate_notes` Tauri command wraps the result into\n`MeetingNotes { meeting_id: id, ..from GeneratedNotes }` before\n`store.upsert_notes`, unchanged in observable behavior. A new\n`StreamingNotes { session_id, summary, decisions, action_items,\nopen_questions, participants }` struct and a new `streaming_notes` table\n(`session_id INTEGER PRIMARY KEY REFERENCES streaming_sessions(id) ON DELETE\nCASCADE`) are added to `streaming_store.rs`, with `upsert_notes`/`get_notes`/\n`delete_notes` methods mirroring `store.rs`'s exactly (same\n`ON CONFLICT(session_id) DO UPDATE` upsert semantics). `StreamingSessionDto`\n(`streaming.rs`) gains an `Option<StreamingNotesDto>` `notes` field,\npopulated by `open_streaming_session`/`list_streaming_sessions`'s open-path\n(matching how `MeetingDto.notes` is attached via `open_meeting`).\n\nA new `generate_streaming_notes(app, id)` Tauri command (registered in\n`lib.rs`'s `invoke_handler`) mirrors the existing `generate_notes` command:\nresolves the active LLM model from Settings (shared logic factored into a\nhelper used by both commands, since duplicating model-resolution would be a\nrefactor-invariant violation), opens `StreamingStore`, and applies three\nserver-side guards symmetrically (each independently enforced, not merely\nrelied on via the UI's disabled button, since the UI guard can always be\nbypassed): the session must exist (`AppError::Store` \"streaming session {id}\nwas not found\", mirroring `open_streaming_session`'s existing not-found\nerror exactly), its `status` must be `stopped` (Craft is blocked while a\nsession is still `active`/On Air — mirrors Meeting's \"Create MFU enabled\nonly after transcription finishes\" pattern; rejected server-side the same\nway an empty transcript is, not just UI-disabled), and its effective\ntranscript must be non-empty. It then builds the transcript by joining only\n`outcome_ok = true` windows' text in `window_index` order (fail-open\n`[unavailable]` windows contribute nothing to the LLM prompt — that marker\nis a UI-display artifact, not real content), errors if the resulting\ntranscript is empty, then calls `llm::generate_notes` via `spawn_blocking`\nexactly like the Meeting path, upserts a `StreamingNotes` row, and returns\nthe refreshed `StreamingSessionDto`.\n\nFrontend: `StreamingView.tsx` gains a Craft button (sparkles icon) in the\nexisting `.streaming-transcript-actions` row (alongside Copy/Export — the\napproved Pencil header-row placement was never adopted into the real\nshipped header even for WP-76, so this follows the real component's actual\nexisting action-row convention instead), enabled only when the session is\nstopped (`!isRunning`), has decoded text (same `hasText` guard Copy/Export\nalready use), AND no Craft request is already in flight for the currently\nopen session (`craftingId === null`) — preventing a rapid double-click from\nfiring two concurrent IPC calls for the same session, mirroring how\n`App.tsx`'s `busy` (combining `transcribingId`/`generatingNotesId`) already\ndisables\
  \ Meeting's own equivalent controls during an in-flight request.\nA `craftingId`-tracked handler (mirroring `handleGenerateNotes` in\n`App.tsx`, including its stale-session guard via a ref) calls the new IPC\ncommand, updates a `notes` state, and surfaces a\nfailure in the existing `error` banner. A new `<aside className=\"wp-mfu\">`\nrenders alongside the transcript (reusing Meeting's existing `.wp-mfu`/\n`.wp-mfu-notes`/`.wp-mfu-placeholder`/`.wp-mfu-section` CSS classes\nverbatim — `.wp-mfu` is a self-contained fixed-width flex item, safely\nreusable inside `.streaming-body`'s flex layout with no new CSS needed):\nthe placeholder state (sparkles icon, \"Run MFU Craft\" title/subtitle,\nidentical copy to Meeting's) before any notes exist, and the populated\nnotes sections after.\n\nThe header status widget (WP-76) gains two more states, already designed\n(pencil/main_view.pen \"Status Widget — States\" panel): \"Crafting MFU…\"\n(accent-colored spinner, elapsed timer) while `craftingId` is set, and \"MFU\nFailed\" (red alert-circle icon, no timer) on a Craft failure. Per the\nconfirmed brainstorm streaming-status-states:1:1 (D2 \"both\"), \"MFU Failed\"\nis shown in the widget until the next relevant action clears it (a new\nCraft attempt or a new Start) rather than an auto-timeout — this is a\nsimpler, more testable interpretation of \"reverts to idle\" than a timer, and\nmatches how the existing `error` banner already persists until the next\naction clears it. `widgetStatus` becomes:\n`isRunning ? \"on-air\" : busy ? \"starting\" : craftingId !== null ?\n\"crafting\" : craftFailed ? \"mfu-failed\" : \"ready\"`. Starting a new session\nalso clears `craftFailed`.\n\nNon-goals:\n- Prettify (diff-view text cleanup) — WP-75, a separate follow-on.\n- Any change to Meeting's own Craft/MFU behavior beyond the internal\n  `GeneratedNotes` refactor (which is observably a no-op for Meeting).\n- Editing/clearing generated Streaming notes from the UI (Meeting has no\n  such affordance either — notes are regenerated by running Craft again,\n  which upserts over the prior result).\n- Adopting the full Pencil-mockup header action row (Start/Stop/Craft/Copy/\n  Export/Delete) into the real Streaming header — only the Craft button\n  itself, placed in the real component's existing action-row convention.\n- Any change to how Craft/MFU works for Meeting's own UI/interaction beyond\n  the shared backend helper extraction.\n\nAcceptance criteria (DoD):\n- [ ] With a stopped session that has decoded text, clicking Craft calls the\n      new IPC command and displays the generated notes in a new MFU panel\n      (summary/decisions/action_items/open_questions/participants sections,\n      each shown only when non-empty, matching Meeting's rendering).\n- [ ] The Craft button is disabled while the session is running (On Air) or\n      has no decoded text.\n- [ ] The status widget shows \"Crafting MFU…\" (accent spinner + timer)\n      while the request is in flight.\n- [ ] On success, the widget returns to \"Ready\"; the populated notes panel\n      is the success signal (no separate flash state).\n- [ ] On failure (no LLM model selected/downloaded, or any other error),\n      the existing error banner shows the message AND the widget shows \"MFU\n      Failed\" until the next Craft attempt or new session Start.\n- [ ] Fail-open (`outcome_ok = false`) windows are excluded from the\n      transcript sent to the LLM.\n- [ ] An empty effective transcript (no successfully-decoded windows) is\n      rejected server-side with a clear error, even if the UI guard is\n      somehow bypassed.\n- [ ] Calling the new command with a nonexistent session ID returns a\n      \"streaming session {id} was not found\" error, mirroring\n      `open_streaming_session`'s existing not-found error.\n- [ ] Calling the new command against a session whose status is `active`\n      (not `stopped`) is rejected server-side, even if the UI guard is\n      somehow bypassed.\n- [ ] The Craft button is also disabled while a Craft request is already in\n      flight for the currently\
  \ open session (no double-trigger).\n- [ ] Generated notes persist: reopening a session later shows its\n      previously generated notes.\n- [ ] Running Craft again on the same session overwrites (not duplicates)\n      its notes row.\n- [ ] Deleting a session with notes deletes its notes too (no orphan row).\n- [ ] Switching to a different session while a Craft request for a prior\n      session is still in flight does not attribute that result or error to\n      the newly active session.\n\nConstraints / design notes:\nBackend: reuses the existing local-only llama.cpp inference path — no new\nnetwork calls (consistent with the app's local-first stance already stated\nfor Meeting's notes and Streaming's core transcription). Performance: Craft\nis UI-blocking for its own duration on the Streaming view specifically\n(button disabled during the call), matching Meeting's existing pattern; it\ndoes not block the rest of the app since `spawn_blocking` is already used.\nSecurity: none new — same trust boundary as Meeting's existing Craft\nfeature. Interaction contract: Craft button follows the same enabled/\ndisabled/icon-only convention as the existing Copy/Export buttons in the\nsame row.\n\nDependencies / integration:\nParent epic WP-68 (done). Depends on `src-tauri/src/llm.rs`'s existing\n`generate_notes`/model-resolution logic (already shipped for Meeting, M3) —\nnot on WP-75 or WP-69. Must not change Meeting's own observable Craft/MFU\nbehavior (`generate_notes` command, `MeetingDto.notes`, `.wp-mfu` rendering\nfor Meeting) — the `GeneratedNotes` extraction is an internal refactor only.\nStatus-widget states \"Ready\"/\"Starting…\"/\"On Air\" already exist (WP-76,\ndone) and are extended, not replaced.\n\nTarget surfaces:\nsrc-tauri/src/llm.rs (GeneratedNotes extraction), src-tauri/src/store.rs\n(no schema change — MeetingNotes construction site moves to lib.rs),\nsrc-tauri/src/streaming_store.rs (StreamingNotes struct, streaming_notes\ntable, upsert/get/delete methods), src-tauri/src/streaming.rs\n(StreamingNotesDto, StreamingSessionDto.notes field, generate_streaming_\nnotes DTO-level function), src-tauri/src/lib.rs (generate_streaming_notes\nTauri command, shared LLM-model-resolution helper, invoke_handler\nregistration), src/ipc.ts (StreamingNotes type, generateStreamingNotes\nfunction, notes field on StreamingSession type), src/StreamingView.tsx\n(Craft button, craftingId/notes/craftFailed state, MFU aside panel, widget\nstatus extension), src/styles.css (no new classes — verbatim reuse of\nexisting .wp-mfu family).\n\nProposed BDD scenarios:\n  Scenario S-1: Happy path — Craft a stopped session with a transcript\n    Given a stopped Streaming session with at least one outcome_ok window\n    When the user clicks Craft\n    Then the widget shows \"Crafting MFU…\", the IPC command is called, and\n      on success the MFU panel shows the generated notes and the widget\n      returns to \"Ready\"\n\n  Scenario S-2: No LLM model selected/downloaded\n    Given no active LLM model is configured in Settings\n    When the user clicks Craft\n    Then the error banner shows the failure message and the widget shows\n      \"MFU Failed\"\n\n  Scenario S-3: Craft is disabled with no decoded text\n    Given a stopped session with zero windows (or only fail-open windows)\n    When the transcript-actions row renders\n    Then the Craft button is disabled, matching Copy/Export's existing\n      hasText guard\n\n  Scenario S-4: Craft is disabled while running\n    Given a session is On Air\n    When the transcript-actions row renders\n    Then the Craft button is disabled regardless of decoded text\n\n  Scenario S-5: Fail-open windows excluded from the LLM transcript\n    Given a session has one outcome_ok=true window and one outcome_ok=false\n      window\n    When Craft runs\n    Then only the outcome_ok=true window's text is present in the transcript\n      passed to generate_notes\n\n  Scenario S-6: Empty effective transcript is rejected server-side\n    Given a session whose only windows are outcome_ok=false\n    When generate_streaming_notes\
  \ is called directly (bypassing the UI guard)\n    Then it returns an error rather than calling the LLM with empty input\n\n  Scenario S-7: Notes persist across reopen\n    Given Craft has succeeded for a session\n    When the user closes and reopens that session\n    Then the previously generated notes render in the MFU panel\n\n  Scenario S-8: Re-running Craft overwrites, not duplicates\n    Given a session already has generated notes\n    When the user runs Craft again\n    Then the notes row is updated in place (upsert), not duplicated\n\n  Scenario S-9: Deleting a session cascades its notes\n    Given a session has generated notes\n    When the session is deleted\n    Then its streaming_notes row is also gone (no orphan)\n\n  Scenario S-10: Switching sessions during an in-flight Craft\n    Given Craft is in flight for session A\n    When the user opens session B before it resolves\n    Then A's eventual result or error is not applied to B's displayed state\n\n  Scenario S-11: Nonexistent session ID\n    Given a session ID that does not exist in streaming_sessions\n    When generate_streaming_notes is called with it\n    Then it returns a \"streaming session {id} was not found\" error\n\n  Scenario S-12: Server-side rejection of an active session\n    Given a session whose status is \"active\" (still On Air)\n    When generate_streaming_notes is called directly (bypassing the UI guard)\n    Then it returns an error rather than generating notes for a still-live\n      session\n\n  Scenario S-13: Same-session double-trigger is prevented\n    Given a Craft request is already in flight for the currently open session\n    When the user clicks Craft again before it resolves\n    Then the button is disabled and no second IPC call is made\n\nCase-derivation evidence:\n| Technique | Scenario IDs or justified N/A |\n|---|---|\n| Equivalence Partitioning | transcript empty/non-empty (S-3/S-6 vs S-1), session running/stopped (S-4/S-12 vs S-1), model available/unavailable (S-2 vs S-1), session exists/not (S-11 vs S-1), request in-flight/not for same session (S-13 vs S-1) |\n| Boundary Value Analysis | S-5/S-6 (all-fail-open vs one-ok-window transcript boundary) |\n| Decision Table | (isRunning, hasText, craftingId===null) -> Craft enabled only at (false, true, true); covered by S-1/S-3/S-4/S-13 |\n| State-Transition | S-1 (Ready→Crafting…→Ready), S-2 (Ready→Crafting…→MFU Failed, persists until next action) |\n| Pairwise / Combinatorial | N/A — justified: three independent UI-disable guards (isRunning, hasText, craftingId===null), each an unrelated precondition with no meaningful pairwise interaction; fully enumerated by the Decision Table above (S-1/S-3/S-4/S-13) |\n\nChild-task breakdown:\nNot applicable — task altitude.\n\nChild-feature breakdown:\nNot applicable — task altitude.\n\nApproved draft: streaming-followups:wp-77:4, digest sha256:0940d2fc92ada37371ce8cf3d99e171fe335149bedd1efd8abbfa7909ed37559, scope-verifier: No gaps."
dod:
- With a stopped session that has decoded text, clicking Craft calls the new IPC command and displays the generated notes in a new MFU panel (summary/decisions/action_items/open_questions/participants, each shown only when non-empty).
- The Craft button is disabled while the session is running (On Air) or has no decoded text.
- The status widget shows "Crafting MFU…" (accent spinner + timer) while the request is in flight.
- On success, the widget returns to "Ready"; the populated notes panel is the success signal (no separate flash state).
- On failure, the existing error banner shows the message AND the widget shows "MFU Failed" until the next Craft attempt or new session Start.
- Fail-open (outcome_ok=false) windows are excluded from the transcript sent to the LLM.
- An empty effective transcript is rejected server-side with a clear error, even if the UI guard is bypassed.
- Calling the command with a nonexistent session ID returns a "streaming session {id} was not found" error.
- Calling the command against an active (not stopped) session is rejected server-side, even if the UI guard is bypassed.
- The Craft button is disabled while a Craft request is already in flight for the currently open session (no double-trigger).
- 'Generated notes persist: reopening a session later shows its previously generated notes.'
- Running Craft again on the same session overwrites (not duplicates) its notes row.
- Deleting a session with notes deletes its notes too (no orphan row).
- Switching to a different session while a Craft request for a prior session is in flight does not attribute that result/error to the newly active session.
