created_by: Aleksei_Platkovskii
description: |-
  Add a WeSpeaker ResNet34 speaker-embedding model as a third selectable variant
  of the `diarization` catalog entry, alongside the existing campplus and
  titanet-large.

  WHY THIS MODEL: the segmentation model already in use is pyannote
  segmentation-3.0, and the reference pyannote 3.1 pipeline pairs that model with
  a WeSpeaker ResNet34 embedding rather than CAM++ or NeMo TitaNet. Matching that
  pairing is the cheapest remaining accuracy step that stays inside ONNX/Rust: it
  drops into machinery that already exists.

  RUN THIS AFTER WP-62. Embedding quality is consumed by clustering, so an A/B
  between embedding models run against the current clustering measures the
  clustering's noise rather than the embeddings. Reuse WP-62's reference
  recordings and metric unchanged so the comparison is meaningful.

  WHAT THIS TOUCHES. The variant machinery already exists and this item should
  add to it rather than change it: `ModelAsset` carries `variant_id` /
  `variant_label` / `recommended` (models.rs); `list_task_models` emits one row
  per variant; `resolve_catalog_target` matches a variant id; settings.rs
  validates `active_model.diarization`; delete_model and
  delete_clears_active_diarization_variant already handle a variant going away.

  THE ONE PLACE A THIRD VARIANT BREAKS AN ASSUMPTION: `fallback_variant_for` in
  diarize_process.rs is a hardcoded two-element swap (titanet-large <->
  campplus). With three variants it is no longer a total function, and WP-57's
  contract — retry EXACTLY ONCE with another model, never retry the same one,
  chain terminates — has to be restated for three members. Do not generalise it
  into a chain of two retries: WP-57 chose one hop because the crash is
  deterministic per input, so a longer chain only multiplies time spent crashing.
  Decide the new mapping explicitly (see DoR) and keep the single-hop guarantee.

  ASSET VERIFICATION. models.rs's catalog comment states that every URL, SHA-256
  and size was verified directly against the publishing source, "not guessed".
  That rule binds this item: download the artifact, hash it, and cross-check
  against the publisher's own checksum listing. No values taken from
  documentation, a model card, or a prior conversation.

  OUT OF SCOPE: the clustering algorithm (WP-62); removing or replacing the
  existing campplus or titanet-large variants; any Settings UI redesign — this
  adds a row to a list that already renders variant rows.
