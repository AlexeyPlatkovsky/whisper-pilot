description: "Implement the local SQLite persistence foundation for the M2 meeting workspace.\nAdd `rusqlite` with its bundled SQLite feature and `src-tauri/src/store.rs`.\nGiven an app-support directory, `Store::open` must create that directory,\ncreate/open a `whisperpilot.sqlite3` database, enable foreign keys, and apply\nan idempotent schema for meetings, segments, and notes.\n\nA meeting has an integer id, title, optional source path/name, creation time,\noptional duration, language, and status. A segment belongs to one meeting and\nhas a stable ordinal, timestamp range, editable text, and optional speaker id.\nNotes are one optional record per meeting with summary, decisions, action\nitems, open questions, and participants. The store API must provide\ncreate/open/update/delete for meetings; list meeting summaries newest first;\nreplace/list segments in ordinal order; and upsert/get/delete notes. Deleting\na meeting must remove its segments and notes through foreign-key cascade.\n\nHappy path: create a meeting, replace its ordered segments and notes, reopen\nthe same database, and read equivalent data plus a list summary. Primary\nfailure behavior: invalid foreign-key input and a duplicate segment ordinal\nreturn a typed store error rather than panicking; an invalid segment range\n(`end_ms < start_ms`) is rejected before writing. Scope boundary: this task\ndoes not register Tauri commands, attach files through the UI, start\ntranscription, auto-save edits from the UI, or expose TypeScript IPC types;\nfollow-on tasks own those integrations.\n\nScenarios:\n- Given an empty app-support directory, when `Store::open` and\n  `create_meeting` run, then the database and schema exist and the new meeting\n  can be opened and appears in `list_meetings`.\n- Given a saved meeting with ordered segments and notes, when the database is\n  reopened, then the same entities are returned in ordinal order and the list\n  summary contains the persisted metadata.\n- Given a segment whose end time precedes its start time, when segments are\n  replaced, then the call returns a typed error and no segment is persisted.\n- Given a meeting with segments and notes, when it is deleted, then opening it\n  returns `None` and dependent rows are absent.\n\nTarget surfaces: `src-tauri/Cargo.toml`, `src-tauri/src/store.rs`,\n`src-tauri/src/error.rs`, and `src-tauri/src/lib.rs` (module registration\nonly). Tests live with `store.rs`. Constraints: macOS desktop app; all data\nremains local in the app-support directory; use bundled SQLite; no network,\nno audio copies, no UI/IPC change, no panic for expected invalid input.\n"
dod:
- '`Store::open` creates an idempotent bundled-SQLite schema under the supplied app-support directory with foreign keys enabled; unit tests prove a second open preserves existing data.'
- Meeting CRUD and newest-first summary listing persist and reload title, optional source metadata, creation time, optional duration, language, and status; unit tests cover create, update, reopen, list, and delete.
- Replacing/listing segments preserves ordinal order and optional speaker ids, rejects an invalid time range or duplicate ordinal without partial persistence, and is covered by unit tests.
- Notes upsert/get/delete works and deleting a meeting cascades to its segments and notes, verified by unit tests.
- '`cargo nextest run --manifest-path src-tauri/Cargo.toml`, `cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings`, and `cargo build --manifest-path src-tauri/Cargo.toml` pass.'
