  URL/SHA-256/size verified by download-and-hash plus the publisher''s own
  headers; the verification method is recorded on the item.'
- 'No `.en` model is present in the catalog, and a test asserts that no
  transcription asset is an English-only build so the constraint cannot be
  reintroduced silently.'
- 'Transcription resolves the ACTIVE transcription variant rather than the
  entry''s first asset — covered by a test that would fail under the current
  `primary_asset_path` behavior.'
- Download and delete operate per transcription variant; a test proves that
  choosing one variant does not fetch the others.
- '`active_model.transcription` is validated against the catalog like
  `active_model.diarization` is, and the unset, unknown-value, legacy
  "transcription" value, and deleted-active-variant cases each have defined,
  tested behavior — no panic, no silent re-download, no wrong-model
  transcription.'
- A user who already has large-v3-turbo on disk still shows as downloaded after
  the change and still transcribes with it — covered by a test over the existing
  file name.
- Settings lists the three transcription variants with their sizes and downloaded
  state, and one is selectable as Active; manual verification per the validate
  skill.
- 'Exactly one transcription variant carries `recommended: true`, per the DoR
  decision.'
- 'Real-audio check: a Russian recording transcribes with each downloaded variant
  and the language is still auto-detected correctly on all three, so the smaller
  models do not break ADR-012''s behavior. Quality differences are noted for the
  user rather than gated on.'
- 'Docs are updated where the catalog is described, and roadmap.md''s beta "one
  model per task" statement is reconciled with what actually ships.'
- 'Local validation passes: cargo test, cargo clippy -D warnings, vitest, lint,
  typecheck, and the 95% coverage gate.'
