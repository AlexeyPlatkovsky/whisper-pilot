created_by: Aleksei_Platkovskii
description: |-
  Give the transcription task more than one model. Today the `transcription`
  catalog entry is a single 874MB asset — Whisper large-v3-turbo (Q8) — with
  `variant_id: None`. Add Whisper medium and Whisper small as selectable
  variants, so a user on a slower machine, a smaller disk, or a rough first pass
  is not forced to download and run the largest model.

  MULTILINGUAL ONLY — HARD CONSTRAINT. Add only the multilingual builds. The
  English-only `.en` variants (ggml-medium.en, ggml-small.en) must NOT appear in
  the catalog. Russian is the primary language the product is tuned and validated
  for (idea.md, ADR-007) and the transcription language is always auto-detected,
  never chosen (ADR-012) — an English-only model would silently destroy the
  product's core promise for its main audience, with no setting anywhere that
  would explain why. Make this constraint visible in the code, not just here.

  WHAT THIS ACTUALLY REQUIRES. The variant machinery exists (the `diarization`
  entry already has campplus and titanet-large) but has never been exercised on
  the transcription entry, and three things assume transcription is single-asset:

  1. transcribe.rs resolves its model with
     `models::primary_asset_path(app_support_dir, "transcription")`, which
     returns the FIRST asset of the entry. With variants present that silently
     becomes "whichever variant happens to be listed first" rather than the one
     the user selected. It has to resolve the ACTIVE variant instead.
  2. `resolve_catalog_target("transcription")` matches the WHOLE entry, and a
     whole-entry target's `download_assets()` returns every asset. Left alone,
     one Download click would fetch all three Whisper models — several gigabytes.
     Download and delete must become per-variant, exactly as they are for
     diarization.
  3. settings.rs already has `active_model.transcription`
     (KEY_ACTIVE_MODEL_TRANSCRIPTION) typed as `Option<String>` with no default,
     and it currently only rejects the empty string. With real variants it must
     validate against the catalog the way `active_model.diarization` does, and
     the unset/missing/deleted-variant cases need defined behavior.

  EXISTING USERS. The large-v3-turbo file name does not change, so an already
  downloaded model stays downloaded on disk. What changes is how it is addressed:
  it acquires a `variant_id` where it previously had none, and
  `active_model.transcription` may be unset or hold the old whole-entry id
  "transcription" (settings.rs's own test sets exactly that value). Both cases
  must resolve to something sensible rather than erroring or silently
  re-downloading.

  RELATED, NOT OWNED: WP-27 specifies the meeting-header model switcher
  ("default large; hidden + warning if none"). That switcher becomes useful once
  this lands, but its UI stays WP-27's. This item owns the catalog, the
  resolution logic, the settings validation, and whatever Settings already
  renders for variants — not a new header control.

  ASSET VERIFICATION. models.rs's catalog comment states that every URL, SHA-256
  and size was verified against the publishing source, "not guessed". That binds
  this item: download each artifact, hash it, and cross-check against Hugging
  Face CDN headers. No values from memory, documentation, or a prior
  conversation.

  OUT OF SCOPE: anything diarization; the header model switcher (WP-27); adding
  large-v3 non-turbo or any distilled variant beyond the three named here.
