description: 'Attribute each transcript segment to a speaker (by roles) and render the transcript as an editable, per-speaker chat of colored bubbles (10 shades). Local sherpa-onnx diarization is merged onto the existing Whisper segments. Ships in M2 alongside the library (F004/WP-11). Scope: diarization engine + model assets, the turn<->segment merge, and the per-speaker bubble UI with editable labels. Out of scope: real-name identification (voice enrollment); labels are generic and user-renamed. Acceptance: within a single file, segments are consistently attributed to distinct speakers and render as a labelled colored-bubble chat that can be edited and saved.'
