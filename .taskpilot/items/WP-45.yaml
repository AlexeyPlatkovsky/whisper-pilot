id: WP-45
title: Add fast CI quality gates with parallel checks and PR comment
priority: normal
type: task
status: in_progress
created_at: '2026-07-22T10:13:28Z'
updated_at: '2026-07-22T10:13:28Z'
description: |
  Add a GitHub Actions CI workflow that runs fast quality gates on every pull
  request (open/update). All checks run in parallel with no inter-job
  dependencies; the workflow fails if any check fails, but every check still
  executes. The final job posts a single markdown summary as a new comment on
  the PR.

  Checks must cover the front-end (TypeScript typecheck, ESLint, Prettier format
  check, Vitest with coverage) and the Rust core (cargo fmt, cargo clippy, cargo
  nextest). If the project is missing the tooling/scripts required for any of
  those checks, install/add the minimal dependencies and npm scripts as part of
  this task.

  Target surfaces: .github/workflows/ci.yml; package.json (+devDependencies and
  scripts); .eslintrc.cjs or equivalent if ESLint has no configuration yet.
  No production Rust/React code changes.
