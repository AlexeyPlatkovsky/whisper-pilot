description: 'Cloud Meeting providers have four related lifecycle defects found during the final code audit. Provider finals are timestamped from the receive-time capture head instead of the audio turn; Deepgram and AssemblyAI can lose the last final result because Stop terminates the socket without a bounded provider-specific drain; WebSocket writes and close have no timeout or cancellation and can strand a session in Stopping; and the renderer can dispatch duplicate Cloud Start calls before its pending state is installed.\n\nScope: preserve provider/commit-owned audio boundaries through persistence, implement bounded graceful final draining for every provider, make all socket writes and close cancellation-aware with deterministic lifecycle finalization, and make Cloud Start single-flight before the first await. Cover delayed and out-of-order finals, partial-only output, provider disconnect, half-open sockets, double Start, and Stop racing a final message.\n\nFailure behavior: Stop reaches Idle or an actionable Error within a bounded deadline, already received transcript data remains durable, provider credentials and payloads are never logged, and no silent fallback to local ASR occurs.\n\nOut of scope: local Meeting ASR/VAD performance, local system-audio callback design, translation quality, provider selection UX, and adding new cloud providers.'
