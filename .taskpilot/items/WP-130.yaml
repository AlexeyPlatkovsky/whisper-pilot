dod:
- Provider finals persist timestamps derived from their audio turn or commit boundaries, including delayed and out-of-order delivery, without 1 ms fallback windows.
- Deepgram and AssemblyAI Stop drains the final provider result within a bounded deadline; a Stop/final race does not lose the last committed phrase.
- Every WebSocket write, termination message and close is cancellation-aware and time-bounded, and the lifecycle reaches Idle or an actionable Error exactly once.
- Cloud Start is single-flight before its first asynchronous operation; repeated click, Return or Space cannot dispatch a second provider session.
- Focused provider-independent and provider-specific tests cover delayed finals, partial-only output, disconnect, half-open writes, double Start and Stop racing a final message.
- Cloud protocol tests, Rust and frontend suites, clippy, typecheck, lint and affected documentation validation pass without exposing provider credentials or payloads.
