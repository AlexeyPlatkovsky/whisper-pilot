description: New streaming_sessions store (parallel to store.rs's meeting tables, not an extension of them) with incremental per-window save so a crash/quit loses at most the last in-flight window. Supports reopen/rename/delete of past sessions, mirroring the Meetings list pattern. No raw audio is retained, only decoded text.
