description: Add an export file-type setting (plain text / Markdown) governing how a meeting (transcript and/or notes) is rendered to a chosen destination file. Plain-text export already exists (saveTextDialog, src/App.tsx, src/ipc.ts); this task adds Markdown-formatted rendering as the second option plus the setting to choose between the two. The header label copy places the transcript on the clipboard using the same rendering as the selected file type.
dod:
- An export file-type setting (plain text / Markdown) is available and persisted.
- Selecting Markdown renders the transcript and/or notes with Markdown syntax (headers, speaker labels, timestamps); selecting plain text preserves today's existing rendering.
- The header label copy places the transcript on the clipboard using the same rendering as the selected file type.
- Unit tests cover both file-type renderings.
