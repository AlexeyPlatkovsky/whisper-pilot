description: 'Implement a microphone AudioSource adapter behind the Rust capture coordinator. It requests access only after an explicit Recorder action, reports authorization state, captures the selected/default input device, converts hardware channel layout and rate into the normalized ASR stream, and handles device changes and interruptions. Restore NSMicrophoneUsageDescription with Recorder-specific wording.


  Happy path: the user grants permission and microphone samples enter the active Recorder session with monotonic sample indices and observable input level. Primary failure behavior: denied or restricted permission, no input device, unsupported format or device loss stops or rejects capture once and exposes an actionable coordinator error. Edge cases include first-run prompt, prior denial, Bluetooth rate change, unplug during capture, silent input, stereo devices and rapid Stop during startup.


  Scenario: Given microphone permission is undetermined, when the user explicitly starts Recorder and grants access, then one capture starts and valid normalized samples reach the coordinator. Given the active device disappears, when capture is running, then the session leaves Capturing without a false green status and preserves already committed data.


  Target surfaces: src-tauri/Info.plist, Cargo target dependencies, a microphone capture module, shared AudioSource and coordinator interfaces, events, typed IPC, permission UI state and focused Rust/Vitest/manual tests.


  Constraints: macOS-first; no microphone access before an explicit action; native callbacks do not block on ASR; raw audio and transcript never enter logs; one live source at a time; system-audio Streaming behavior remains unchanged.'
dod:
- The source Info.plist contains a Recorder-specific NSMicrophoneUsageDescription and a real bundled app presents the macOS prompt only after explicit Start.
- Granted permission produces normalized mono samples with monotonic positions for supported built-in, USB and Bluetooth input formats selected by the validation matrix.
- Denied, restricted, missing-device, unsupported-format and device-removal paths leave no active native handle or falsely Capturing coordinator state and expose actionable errors.
- Startup and shutdown races, silence, channel conversion and sample-rate conversion boundaries have focused tests.
- Real-microphone smoke checks, Rust/frontend validation, permission review and documentation maintenance pass without regressing ScreenCaptureKit Streaming.
