dod:
- On first launch / with no session ever run, the widget shows "Ready" (green check icon, no timer).
- Clicking Start shows "Starting…" (neutral gray icon, no timer) until isRunning becomes true, then switches to "On Air" (red icon, red text, timer running from 0:00).
- While On Air, the timer increments once per second and switches to h:mm:ss format once elapsed time reaches 60 minutes.
- Clicking Stop, or the session ending on its own, returns the widget to "Ready" and stops the timer.
- Opening a past (stopped) session from the sidebar list shows "Ready", not "On Air".
- If the Start call fails before isRunning becomes true, the widget falls back to "Ready" (the existing error banner shows the failure).
- While a Stop request is in flight, the widget remains "On Air" until isRunning actually flips false.
- The widget has no click/hover/keyboard interaction of its own.
