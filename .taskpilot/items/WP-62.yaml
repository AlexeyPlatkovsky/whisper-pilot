description: "A WhisperPilot user transcribes a local recording with an available diarization variant and receives the existing speaker-attributed transcript flow. The ADR-013 worker obtains pyannote segmentation through ONNX Runtime, derives embeddings with the selected existing embedding variant, and assigns speakers with Rust-owned incremental-centroid threshold clustering rather than sherpa-onnx's vendored fast clustering. It returns ordered speaker turns to the existing merge/UI path.\n\nIf model assets, direct ONNX inference, embedding extraction, or clustering fails, the existing child-process outcome handling preserves its four outcomes and degrades to a plain transcript with the existing warning. No fallback or silent model substitution is added.\n\nThe user selected 0.85 as the automatic clustering threshold after the ordered measurement sweep. The two known-two-speaker recordings and their baseline/Route-A cluster-count and dominant-two-cluster speech-share values are recorded in docs/plans/2026-07-27-wp-62-clustering-feasibility-spike.md.\n\nNon-goals:\n- Replacing pyannote segmentation-3.0, changing embedding-model choice (WP-63), implementing fixed speaker-count control (WP-49), or removing ADR-013 isolation.\n- Changing transcript UI behavior, the existing no-model warning, or WP-57 child-outcome/fallback behavior.\n\nConstraints:\n- Use the shared verified model archive, active embedding selection, 16 kHz mono input, local-only processing, and existing model-download verification.\n- The direct binding supports the Rust 1.80 MSRV and uses the already packaged ONNX Runtime dylib.\n- Fixed-count control is reserved for WP-49.\n\nProposed BDD scenarios:\n  Scenario S-1: Direct Rust diarization produces speaker turns\n    Given an active diarization embedding and verified pyannote segmentation model\n    When the ADR-013 worker diarizes local 16 kHz audio\n    Then it returns ordered turns from direct ONNX segmentation, the selected extractor, and Rust-owned clustering\n    And the production path does not invoke sherpa-rs Diarize.\n\n  Scenario S-2: New-path failure remains fail-open\n    Given direct ONNX, embedding, or clustering cannot run\n    When transcription reaches diarization\n    Then existing child-outcome classification is preserved\n    And transcription completes with the existing diarization warning.\n\n  Scenario S-3: Clustering handles mathematical boundary sets\n    Given empty, one-speaker, well-separated, and threshold-adjacent embeddings\n    When Rust incremental-centroid threshold clustering runs\n    Then it returns deterministic expected clusters without panicking\n    And its interface represents fixed-K without using it.\n\n  Scenario S-4: Route A ordered threshold sweep is recorded\n    Given the fixed known-two-speaker recordings and vendored baseline\n    When the Route-A regression runs 0.95, 0.90, 0.85, 0.80, and 0.75 in order\n    Then it records before/after cluster count and dominant-two speech share\n    And the 92.47-second recording completes without a native abort.\n\nCase-derivation evidence:\n- EP: S-3 empty, one-speaker, well-separated, threshold-adjacent; S-2 successful and failed worker paths.\n- BVA: S-3 pairs immediately inside/outside each sweep threshold.\n- Decision table and state transition: S-2 error class through retained child outcomes.\n- Pairwise: S-4 recording × threshold × baseline/Route-A path."
dor: []
dod:
- The production diarization path obtains segmentation through direct Rust ONNX Runtime, derives embeddings through the selected variant, and creates ordered turns through Rust-owned incremental-centroid threshold clustering without calling sherpa-rs Diarize.
- Rust tests cover well-separated, near-threshold, single-speaker, and empty clustering sets; the interface represents both distance-threshold and fixed-K stops while fixed-K remains unused.
- An ignored real-audio test records before/after cluster count and dominant-two speech share for both known-two-speaker recordings at 0.95, 0.90, 0.85, 0.80, and 0.75 in order, and the 92.47-second recording completes without a native abort.
- ADR-013 isolation and WP-57's four child outcomes remain covered; new-path errors degrade to the existing no-speaker warning.
- The pinned direct ONNX dependency, bundled dylib/rpath implications, and validation evidence are documented; local Rust and frontend validation passes.
- ADR-005 and ADR-013 record the removed vendored clustering path, its Rust replacement, and retained isolation.
- The user-selected 0.85 threshold is the production default and the completion evidence records its measured acceptance result.
