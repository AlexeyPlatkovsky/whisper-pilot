schema_version: 1
id: WP-62
title: Replace sherpa-onnx vendored clustering with own agglomerative clustering in Rust
priority: normal
type: task
status: backlog
created_at: '2026-07-27T17:04:04Z'
updated_at: '2026-07-27T17:06:44Z'
parent_id: WP-61
created_by: Aleksei_Platkovskii
description: |-
  Take speaker clustering away from sherpa-onnx's vendored C++ and do it in Rust
  over the embeddings we already compute. One root cause, two defects.

  DEFECT 1 — QUALITY. ADR-013 records that on the known-2-speaker 861.5s
  recording, threshold 0.9 leaves the two dominant clusters holding 786s of 861s
  with five residuals under 8s, and dropping to 0.7 splits the second real
  speaker in two (294.3s becoming 180.4 + 111.5) while cluster count rises 7 ->
  12. This is a clustering failure, not a segmentation or embedding one: the
  segmentation model in use is pyannote segmentation-3.0, the same model the
  reference pyannote 3.1 pipeline runs.

  DEFECT 2 — STABILITY. The SIGBUS that forced the ADR-013 child-process design
  faults inside that same vendored fast-clustering code
  (OfflineSpeakerDiarizationPyannoteImpl::Process, wild negative index,
  EXC_BAD_ACCESS / KERN_PROTECTION_FAILURE). ADR-013 documents that tuning cannot
  fix it: crash safety on the 92.4s recording needs threshold < 0.8 while
  separation quality on the 861.5s recording needs 0.9. Removing the code removes
  the conflict instead of containing it.

  FEASIBILITY — ANSWER THIS FIRST. sherpa-rs 0.6.8 exposes diarization only as
  the all-in-one sherpa_rs::diarize::Diarize::compute (segmentation + embedding +
  clustering in one native call). It does NOT expose the pyannote segmentation
  model on its own. It DOES expose per-chunk embedding extraction:
  sherpa_rs::speaker_id::EmbeddingExtractor::compute_speaker_embedding. The
  embedding half is available, the segmentation half is not, and that is the
  whole risk. Candidate routes, decided by the spike named in DoR:
    (a) run sherpa-onnx-pyannote-segmentation-3-0/model.onnx directly through an
        ONNX runtime binding in Rust (the `ort` crate, or sherpa-rs-sys's raw
        C API), implement the powerset -> speaker-activity post-processing
        ourselves, then EmbeddingExtractor per speech chunk, then our clustering.
        Highest fidelity, most work, adds a dependency.
    (b) fork or patch sherpa-rs to expose segmentation output and/or embeddings
        from the diarization path. Less new code, a vendored fork to carry.
    (c) substitute VAD-based segmentation (sherpa_rs::silero_vad) for pyannote
        segmentation. Cheapest, but loses overlap handling and turn precision —
        likely to cost more quality than the new clustering wins. Fallback only.

  CLUSTERING TO IMPLEMENT: agglomerative hierarchical clustering with cosine
  distance and a threshold stop criterion, which is what the current
  configuration is already expressed in terms of, so the existing threshold
  semantics carry over. WP-49 needs a "stop at K clusters" criterion instead —
  make the interface able to express both stop criteria, but do not implement the
  speaker-count path here.

  ISOLATION STAYS. Removing the vendored clustering removes the known crash SITE,
  but embedding extraction and segmentation are still native ONNX code running on
  user audio. Keep the child process and record in the ADR that the original
  crash cause is gone. WP-57's crash-triggered embedding fallback keys off the
  four distinguishable child outcomes; that contract must survive unchanged.

  THRESHOLD: 0.9 is quality-optimal for the vendored clustering and has no reason
  to transfer to a new implementation. Re-tune against the reference recordings
  as part of this item and record the new value with its evidence.

  OUT OF SCOPE: the embedding model choice (WP-63); the speaker-count override
  (WP-49); removing the ADR-013 process isolation.
dod:
- 'The feasibility route (a/b/c above) is chosen, the choice and its evidence are
  recorded on this item, and the resulting design is implemented — speaker
  clustering runs in our Rust code and sherpa-onnx''s vendored clustering is no
  longer called on the production path.'
- 'Agglomerative clustering with cosine distance is unit-tested in Rust against
  hand-constructed embedding sets: well-separated clusters, a near-threshold
  pair, a single-speaker input, and an empty input.'
- 'Quality is measured on the reference recordings before and after, and the
  numbers are recorded on the item: the known-2-speaker 861.5s recording yields
  two dominant clusters with materially less residual fragmentation than the
  pre-change 7-cluster baseline, and no regression on the 92.4s recording.'
- 'The 92.4s recording that reproduced the ADR-013 SIGBUS
  (2026-07-21 12-07-19.mp4 + titanet-large) completes without a native abort,
  proven by a test following the existing ignored-by-default convention in
  diarize_integration.rs / wp50_tuning_regression.rs.'
- 'The clustering threshold is re-tuned for the new implementation, the chosen
  value is justified by the reference-recording measurements, and the reason is
  recorded where a future reader will find it rather than only in this item.'
- 'The ADR-013 child-process isolation is still in place and WP-57''s four
  distinguishable child outcomes still behave as specified — covered by the
  existing tests, which must not need weakening.'
- 'The clustering interface can express both a distance-threshold stop and a
  fixed-K stop, with the fixed-K path left unimplemented and unused so WP-49 can
  land on it without redesign.'
- 'ADR-005 and ADR-013 are updated (or superseded) to record that the vendored
  clustering is gone, what replaced it, and that the isolation is retained for a
  different reason than the one that created it.'
- 'Local validation passes: cargo test, cargo clippy -D warnings, vitest, lint,
  typecheck, and the 95% coverage gate.'
dor:
- 'FEASIBILITY SPIKE COMPLETE — a timeboxed spike has established whether
  pyannote segmentation output and per-chunk embeddings can be obtained without
  the vendored clustering, and which of routes (a), (b) or (c) is viable. This
  item is not implementable until that answer exists.'
- 'If route (a) is chosen, the user has approved adding an ONNX runtime binding
  (`ort` or equivalent) as a direct dependency, including its effect on the
  bundled-dylib and code-signing work WP-60 established.'
- 'If route (b) is chosen, the user has approved carrying a forked/patched
  sherpa-rs and the maintenance that implies.'
- 'The shared reference recording set is fixed and available on the implementing
  machine: the known-2-speaker 861.5s recording and the 92.4s
  2026-07-21 12-07-19.mp4 named in ADR-013, plus any third recording the user
  wants included.'
- 'The shared quality metric is agreed — at minimum cluster count versus known
  speaker count and share of speech in the dominant clusters, since no reference
  diarization labels exist for a true DER. If the user wants DER, labelled ground
  truth has to be produced first and that is a separate item.'
